# uplert config (saved by the interactive editor)
app:
    events_buffer: 4096
    workers: 2
    debounce_ms: 300
    scan_interval_seconds: 0
    scan_on_start: false
process:
    enabled: true
    dry_run: false
    kill_only_critical: null
    interval_seconds: 2
    web_parents:
        - php-fpm
        - php
        - nginx
        - apache2
        - httpd
        - node
        - uvicorn
        - gunicorn
        - python3
    shell_names:
        - sh
        - bash
        - dash
        - zsh
        - nc
        - ncat
        - socat
        - python
        - python3
        - perl
        - curl
        - wget
log_level: info
log_format: text
watch:
    dirs:
        - ./test_uploads
    ignore:
        - '[]'
alerts:
    stdout: true
    webhook: ""
    telegram_bot_token: 8709295146:AAEgk8s76ZFu53NJRFGvOLspT5LOFxdzLzM
    telegram_chat_id: "1060834219"
