name: CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  test:
    name: test (${{ matrix.go }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["stable"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
      - name: gofmt check
        run: |
          gofmt -l ./cmd ./internal | tee /dev/stderr | test -z _
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race ./...
      - name: build (static)
        run: CGO_ENABLED=0 go build -trimpath -ldflags="-s -w" -o bin/uplert ./cmd/uplert
